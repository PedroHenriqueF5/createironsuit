name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Guardar o jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: createironsuit-jar
          path: build/libs/*.jar
